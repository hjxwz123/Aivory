name: Build & push sandbox images

# Builds the two sandbox images in the cloud (no local Docker needed) and
# pushes them to GitHub Container Registry (ghcr.io):
#   - aivory-sandbox          (Python runtime each session container runs)
#   - aivory-sandbox-sidecar  (FastAPI control service the Go backend calls)
#
# These are bundled into the main stack (deploy/docker-compose.prod.yml ships a
# `sandbox` service that pulls them), so they must be published for a turnkey
# deploy. Trigger: any main push touching sandbox-service/, every semver release
# tag, or manually via the Actions tab. Images land at:
#   ghcr.io/<account>/aivory-sandbox:latest
#   ghcr.io/<account>/aivory-sandbox-sidecar:latest

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'sandbox-service/**'
      - '.github/workflows/sandbox-image.yml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Server arch. Change to linux/arm64 (and DOCKER_CLI_ARCH=aarch64 in
  # Dockerfile.sidecar) for ARM servers, or list both for multi-arch.
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: aivory-sandbox
            dockerfile: sandbox-service/Dockerfile.runner
          - name: aivory-sandbox-sidecar
            dockerfile: sandbox-service/Dockerfile.sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr image paths must be lowercase; the owner may contain capitals.
      - name: Compute lowercase owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: sandbox-service
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
