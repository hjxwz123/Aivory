name: Build desktop app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      server_base_url:
        description: 'Optional API server origin (without /api). Frontend is bundled locally. Leave empty for first-launch setup.'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Optional existing published Release tag. Build this tag and attach installers after all builds succeed.'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: --win --x64
          - os: macos-latest
            name: macos-arm64
            args: --mac --arm64
          - os: macos-latest
            name: macos-x64
            args: --mac --x64
          - os: ubuntu-latest
            name: linux-x64
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      AIVORY_DESKTOP_BASE_URL: ${{ inputs.server_base_url }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
      CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2t64
      - name: Verify Release version
        if: env.RELEASE_TAG != ''
        run: node -e "const v = require('./package.json').version; if (process.env.RELEASE_TAG.replace(/^v/, '') !== v) throw new Error('Release tag must match package version')"
      - name: Build desktop installers
        # Debian packaging requires homepage metadata. It is the project's
        # homepage, independent of the deployment-specific server address.
        run: |
          # Missing GitHub Secrets become empty strings. electron-builder treats
          # an empty CSC_LINK as a certificate path pointing at the cwd.
          for signing_input in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!signing_input:-}" ]]; then unset "$signing_input"; fi
          done
          npm run desktop:build -- ${{ matrix.args }} --config.extraMetadata.homepage=https://github.com/hjxwz123/Aivory
      - name: Normalize Linux installer filenames
        if: runner.os == 'Linux'
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, renameSync } from 'node:fs'
          // electron-builder expands x64 to x86_64 for AppImage and amd64 for
          // Debian. The official update catalog uses one x64 filename scheme.
          for (const file of readdirSync('desktop/release')) {
            const name = file.replace(/-linux-x86_64\.AppImage$/, '-linux-x64.AppImage').replace(/-linux-amd64\.deb$/, '-linux-x64.deb')
            if (name !== file) renameSync(`desktop/release/${file}`, `desktop/release/${name}`)
          }
          NODE
      - name: Verify macOS bundle signatures
        if: runner.os == 'macOS'
        run: node desktop/verify-mac.mjs
      - name: Verify installer files
        env:
          EXPECTED_PLATFORM: ${{ matrix.name }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, statSync } from 'node:fs'
          import { createRequire } from 'node:module'
          import path from 'node:path'
          const require = createRequire(path.resolve('desktop/package.json'))
          const asar = require('@electron/asar')
          const version = JSON.parse(readFileSync('package.json')).version
          const platform = process.env.EXPECTED_PLATFORM.replace('windows-', 'win-').replace('macos-', 'mac-')
          const extensions = platform.startsWith('win-') ? ['exe'] : platform.startsWith('mac-') ? ['dmg', 'zip'] : ['AppImage', 'deb']
          const files = readdirSync('desktop/release')
          for (const extension of extensions) {
            const name = `Aivory-${version}-${platform}.${extension}`
            if (!files.includes(name) || statSync(`desktop/release/${name}`).size < 1024 * 1024) throw new Error(`Missing or empty installer: ${name}`)
          }
          const config = JSON.parse(readFileSync('desktop/generated/app/config.json'))
          if (!process.env.AIVORY_DESKTOP_BASE_URL && config.baseUrl !== '') throw new Error('Official installers must use first-launch server setup')
          const entry = readFileSync('desktop/generated/app/web/index.html', 'utf8')
          if (!entry.includes('/assets/') || !readdirSync('desktop/generated/app/web/assets').some(file => file.endsWith('.js'))) throw new Error('Desktop frontend must be bundled')
          const archives = []
          for (const folder of readdirSync('desktop/release', { withFileTypes: true }).filter(item => item.isDirectory())) {
            const root = `desktop/release/${folder.name}`
            const archive = platform.startsWith('mac-') ? `${root}/Aivory.app/Contents/Resources/app.asar` : `${root}/resources/app.asar`
            try { if (statSync(archive).isFile()) archives.push(archive) } catch { /* Other build directories. */ }
          }
          if (!archives.length) throw new Error('Missing packaged application archive')
          for (const archive of archives) {
            const files = asar.listPackage(archive).map(file => file.replaceAll('\\', '/'))
            for (const file of ['/web/index.html', '/local-web.cjs', '/api-requests.cjs', '/audio-socket.cjs', '/node_modules/ws/index.js']) {
              if (!files.includes(file)) throw new Error(`Missing bundled runtime: ${file}`)
            }
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: aivory-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb

  attach-release:
    if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aivory-*
          path: installers
          merge-multiple: true
      - name: Attach installers and checksums to published Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > is-draft.txt
          test "$(cat is-draft.txt)" = false
          cd installers
          sha256sum Aivory-* > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" Aivory-* SHA256SUMS.txt --clobber
          echo "Desktop installers published: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
